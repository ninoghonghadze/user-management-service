[project]
name = "user-management-service"
version = "0.1.0"
description = "User management microservice with FastAPI"
authors = [
    {name = "Nino Ghonghadze"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "bcrypt (>=4.0.1,<5.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "aio-pika (>=9.0.0,<10.0.0)",
    "aioboto3 (>=11.0.0,<13.0.0)",
    "python-multipart (>=0.0.6,<1.0.0)",
    "black (>=23.0.0,<25.0.0)",
    "isort (>=5.12.0,<6.0.0)",
    "pytest (>=7.0.0,<9.0.0)",
    "pytest-asyncio (>=0.23.0,<1.0.0)",
    "httpx (>=0.24.0,<1.0.0)"
]
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"